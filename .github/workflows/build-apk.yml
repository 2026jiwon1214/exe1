name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'daily-log.apk'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build APK with Gradle Wrapper
        working-directory: ./android
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Copy APK to repository root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./daily-log.apk
          ls -lh ./daily-log.apk

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-log-apk
          path: ./daily-log.apk

      - name: Commit and push APK to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-log.apk
          git diff --staged --quiet || (git commit -m "build: update daily-log.apk [skip ci]" && git push origin main)
