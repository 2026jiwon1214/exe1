name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'daily-log.apk'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android SDK
        id: sdk
        run: |
          # GitHub Ubuntu runners have the SDK at this path
          SDK_PATH="/usr/local/lib/android/sdk"
          echo "SDK path: $SDK_PATH"
          ls "$SDK_PATH" || true
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install required SDK components
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            --sdk_root=$ANDROID_SDK_ROOT

      - name: Create local.properties
        working-directory: ./android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -100

      - name: Show APK output
        run: |
          find android -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Copy APK to repository root
        run: |
          APK=$(find android -name "*.apk" | head -1)
          echo "Found APK at: $APK"
          cp "$APK" ./daily-log.apk
          ls -lh ./daily-log.apk

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-log-apk
          path: ./daily-log.apk

      - name: Commit and push APK to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-log.apk
          git diff --staged --quiet || (git commit -m "build: update daily-log.apk [skip ci]" && git push origin main)
