name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'daily-log.apk'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon

      - name: Copy APK to repository root
        run: |
          cp android/app/build/outputs/apk/release/*.apk ./daily-log.apk || cp android/app/build/outputs/apk/debug/*.apk ./daily-log.apk
          ls -lh ./daily-log.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-log-apk
          path: ./daily-log.apk

      - name: Commit and push APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-log.apk
          git diff --staged --quiet || (git commit -m "build: update daily-log.apk [skip ci]" && git push origin main)
