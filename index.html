<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데일리로그 - 달력 일기 & To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (Compat 버전 - 빌드 도구 없이 즉시 동작) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary: #0ea5e9;           /* 스카이블루 메인 포인트 */
      --primary-hover: #0284c7;     /* 딥 스카이블루 */
      --primary-light: #f0f9ff;     /* 은은한 하늘색 배경 */
      --primary-soft: #e0f2fe;      /* 부드러운 하늘색 틴트 */
      --primary-border: #bae6fd;    /* 하늘색 테두리 */
      --text-main: #0f172a;         /* 깊은 블랙/차콜 */
      --text-sub: #334155;          /* 다크 그레이 */
      --text-muted: #64748b;        /* 중간 흑백 그레이 */
      --bg-page: #f8fafc;           /* 쿨 화이트/연한 모노톤 배경 */
      --bg-card: #ffffff;           /* 퓨어 화이트 */
      --border: #e2e8f0;            /* 흑백 라이트 보더 */
      --border-dark: #cbd5e1;       /* 진한 그레이 보더 */
      --todo-badge-bg: #f1f5f9;     /* 모노톤 뱃지 배경 */
      --todo-badge-text: #1e293b;   /* 모노톤 뱃지 텍스트 */
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 헤더 */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 26px;
    }

    .logo-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-danger-ghost {
      color: var(--danger);
      background: transparent;
      border-color: transparent;
    }

    .btn-danger-ghost:hover {
      background: var(--danger-light);
    }

    /* 메인 컨테이너 */
    main {
      max-width: 1060px;
      width: 100%;
      margin: 28px auto;
      padding: 0 20px;
      flex: 1;
    }

    /* 달력 컨트롤 바 */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .current-month-text {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
      transition: background 0.15s;
    }

    .nav-btn:hover {
      background: #f1f5f9;
    }

    /* 달력 본체 */
    .calendar-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .weekday {
      padding: 12px 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .weekday.sun { color: #64748b; }
    .weekday.sat { color: var(--primary); }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day-cell {
      min-height: 108px;
      padding: 8px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: background 0.15s ease;
      position: relative;
      background: #ffffff;
    }

    .day-cell:nth-child(7n) {
      border-right: none;
    }

    .day-cell:hover {
      background: var(--primary-light);
    }

    .day-cell.other-month {
      background: #fafafa;
      opacity: 0.4;
    }

    .day-cell.today {
      background: #f8fafc;
    }

    .day-cell.today .day-number {
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 3px rgba(14, 165, 233, 0.4);
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .day-number {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .day-cell.sunday .day-number { color: #475569; }
    .day-cell.saturday .day-number { color: var(--primary); }
    .day-cell.today.sunday .day-number,
    .day-cell.today.saturday .day-number { color: #fff; }

    .cell-indicators {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: auto;
    }

    .mood-indicator {
      font-size: 17px;
      line-height: 1;
    }

    .diary-indicator {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      color: #0369a1;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      padding: 2px 6px;
      border-radius: 6px;
      width: fit-content;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .todo-indicator {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      color: var(--todo-badge-text);
      background: var(--todo-badge-bg);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      width: fit-content;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 모달 팝업 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      transform: scale(0.96) translateY(10px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 2;
    }

    .modal-date-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    .modal-body {
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* 할 일(To-Do) 스타일 */
    .todo-input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }

    .todo-time-input {
      width: 110px;
      padding: 9px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      outline: none;
      background: #fff;
      color: var(--text-main);
      transition: border 0.15s;
    }

    .todo-time-input:focus {
      border-color: var(--primary);
    }

    .todo-input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      outline: none;
      transition: border 0.15s;
    }

    .todo-input:focus {
      border-color: var(--primary);
    }

    .todo-time-tag {
      background: var(--primary-soft);
      color: #0284c7;
      border: 1px solid var(--primary-border);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    /* 기간 일정 / 여행 배너 스타일 */
    .trip-event-banner {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 4px;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      transition: transform 0.1s, filter 0.1s;
    }

    .trip-event-banner:hover {
      filter: brightness(0.96);
      transform: translateY(-1px);
    }

    .trip-badge-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .trip-badge-item .trip-del-btn {
      background: rgba(0,0,0,0.06);
      border: none;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .trip-badge-item .trip-del-btn:hover {
      background: rgba(0,0,0,0.15);
    }

    /* 테마 커스텀 및 팔레트 스타일 */
    .color-chip {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .color-chip:hover {
      transform: scale(1.15);
    }
    .color-chip.selected {
      border-color: #0f172a;
      transform: scale(1.18);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8), 0 0 0 4px #0f172a;
    }

    .theme-chip-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid var(--border);
      background: #f8fafc;
      transition: all 0.15s;
    }
    .theme-chip-btn .theme-del-btn {
      display: none;
      font-size: 11px;
      margin-left: 3px;
      color: #94a3b8;
      cursor: pointer;
      padding: 0 3px;
      border-radius: 3px;
    }
    .theme-chip-btn:hover .theme-del-btn {
      display: inline-block;
    }
    .theme-chip-btn .theme-del-btn:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: #f8fafc;
      border: 1px solid var(--border);
      transition: background 0.15s;
    }

    .todo-item:hover {
      background: #f1f5f9;
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .todo-checkbox {
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .todo-text {
      font-size: 14px;
      word-break: break-all;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .todo-delete-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .todo-delete-btn:hover {
      color: var(--danger);
      background: var(--danger-light);
    }

    .todo-empty-msg {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      padding: 12px;
      background: #fafafa;
      border-radius: var(--radius-sm);
      border: 1px dashed var(--border);
    }

    /* 일기(Diary) 영역 스타일 */
    .auto-meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }

    .meta-tag {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .meta-tag input {
      border: none;
      background: transparent;
      font-size: 12px;
      color: var(--text-main);
      outline: none;
      width: 90px;
    }

    .meta-tag input.wide-input {
      width: 110px;
    }

    .btn-auto-refresh {
      background: #f1f5f9;
      border: 1px dashed #cbd5e1;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .btn-auto-refresh:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    /* 기분(Mood) 선택 */
    .mood-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }

    .mood-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 4px;
    }

    .mood-btn {
      background: #f8fafc;
      border: 1px solid var(--border);
      font-size: 20px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1;
    }

    .mood-btn:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .mood-btn.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary);
    }

    /* 본문 입력 */
    .diary-textarea {
      width: 100%;
      height: 150px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border 0.15s;
    }

    .diary-textarea:focus {
      border-color: var(--primary);
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
      border-bottom-left-radius: var(--radius-lg);
      border-bottom-right-radius: var(--radius-lg);
    }

    /* 토스트 알림 (모던 딥블랙 & 스카이블루 라인) */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: #0f172a;
      border: 1px solid rgba(14, 165, 233, 0.35);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 14px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* 반응형 */
    @media (max-width: 640px) {
      .day-cell {
        min-height: 80px;
        padding: 4px;
      }
      .current-month-text {
        font-size: 18px;
      }
      .modal-body {
        padding: 16px;
      }
      .auto-meta-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .meta-tag {
        width: 100%;
        justify-content: space-between;
      }
      .meta-tag input {
        width: auto;
        text-align: right;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header>
    <div class="logo-area">
      <span class="logo-icon">🗓️</span>
      <h1 class="logo-title">데일리로그</h1>
      <span id="sync-status-badge" style="font-size: 11px; padding: 2px 8px; border-radius: 12px; background: #f1f5f9; color: #64748b; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
        ☁️ 로컬 저장 모드
      </span>
    </div>
    <div class="header-actions">
      <button class="btn" id="google-auth-btn" style="border-color: #bae6fd; background: #f0f9ff; color: #0284c7; font-weight: 600;">
        🔑 구글 로그인 (실시간 연동)
      </button>
      <button class="btn btn-primary" id="open-trip-modal-btn">✈️ 여행/기간 일정 추가</button>
      <button class="btn" id="today-btn">📍 오늘로 이동</button>
      <button class="btn" id="backup-btn" title="모든 데이터 백업">💾 백업</button>
      <button class="btn" id="restore-btn" title="백업 파일 불러오기">📂 복원</button>
      <input type="file" id="restore-file-input" accept=".json" style="display: none;">
    </div>
  </header>

  <!-- 메인 캘린더 화면 -->
  <main>
    <div class="calendar-header">
      <div class="month-nav">

  <script>
    // ================= Firebase 클라우드 설정 & 동기화 =================
    const firebaseConfig = {
      apiKey: "AIzaSyBMTuIqgPIkpTh0ZFdhYpzbbRtdBmS8RcY",
      authDomain: "exe1-dd0a2.firebaseapp.com",
      projectId: "exe1-dd0a2",
      storageBucket: "exe1-dd0a2.firebasestorage.app",
      messagingSenderId: "995293145620",
      appId: "1:995293145620:web:79d9448757d84c5bd2d501",
      measurementId: "G-5P9KJZOPHX"
    };

    let currentUser = null;
    let auth = null;
    let db = null;
    let isCloudSyncing = false;

    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
      }
    } catch (err) {
      console.warn("Firebase 초기화 알림:", err);
    }

    // 클라우드로 데이터 업로드 (동기화)
    async function syncToCloud() {
      if (!currentUser || !db || isCloudSyncing) return;
      updateSyncBadge('☁️ 동기화 중...', '#0284c7', '#e0f2fe');

      try {
        const payload = {
          calendarData: getStore(),
          trips: getEventsStore(),
          customThemes: getCustomThemes(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          userEmail: currentUser.email || ''
        };
        await db.collection('user_calendars').doc(currentUser.uid).set(payload, { merge: true });
        updateSyncBadge('☁️ 실시간 동기화 완료', '#059669', '#d1fae5');
      } catch (e) {
        console.warn("클라우드 업로드 실패:", e);
        updateSyncBadge('⚠️ 동기화 대기 중', '#d97706', '#fef3c7');
      }
    }

    // 클라우드 실시간 리스너 (폰/PC 양방향 즉시 반영)
    function listenToCloud(uid) {
      if (!db) return;
      db.collection('user_calendars').doc(uid).onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          if (data && data.calendarData) {
            isCloudSyncing = true;
            setStore(data.calendarData);
            if (data.trips) setEventsStore(data.trips);
            if (data.customThemes) setCustomThemes(data.customThemes);
            renderCalendar();
            isCloudSyncing = false;
            updateSyncBadge('☁️ 실시간 동기화 완료', '#059669', '#d1fae5');
          }
        } else {
          // 클라우드에 아직 데이터가 없으면 현재 로컬 데이터를 최초 업로드
          syncToCloud();
        }
      }, err => {
        console.warn("클라우드 실시간 수신 오류:", err);
      });
    }

    function updateSyncBadge(text, color, bg) {
      const badge = document.getElementById('sync-status-badge');
      if (badge) {
        badge.textContent = text;
        badge.style.color = color;
        badge.style.background = bg;
      }
    }

    // 구글 로그인 / 로그아웃 핸들러
    function handleGoogleAuth() {
      if (!auth) {
        alert("Firebase 인증 모듈을 불러오는 중입니다. 잠시 후 다시 시도해주세요.");
        return;
      }

      if (currentUser) {
        if (confirm(`'${currentUser.displayName || currentUser.email}' 계정에서 로그아웃 하시겠습니까?`)) {
          auth.signOut().then(() => {
            showToast("로그아웃 되었습니다.");
          });
        }
        return;
      }

      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(result => {
          showToast(`환영합니다, ${result.user.displayName || '사용자'}님! ☁️`);
        })
        .catch(err => {
          console.error("구글 로그인 오류:", err);
          if (err.code === 'auth/popup-blocked') {
            auth.signInWithRedirect(provider);
          } else {
            alert(`구글 로그인 안내:\nFirebase 콘솔의 Authentication에서 Google 로그인을 사용 설정해주세요.\n(${err.message})`);
          }
        });
    }

    // 상태 관리
    let currentDate = new Date();
    let selectedDateStr = null; // 'YYYY-MM-DD'
    let selectedMood = '';

    // 로컬 스토리지 키
    const STORAGE_KEY = 'daily_log_calendar_data';
    const EVENTS_STORAGE_KEY = 'daily_log_period_events';
    const CUSTOM_THEMES_STORAGE_KEY = 'daily_log_custom_themes';

    // 여행/기간 일정 기본 테마 프리셋 (흑백 & 하늘색 포인트)
    const DEFAULT_TRIP_THEMES = [
      { id: 'trip', icon: '✈️', name: '여행', color: '#e0f2fe', textColor: '#0369a1', borderColor: '#7dd3fc', isCustom: false },
      { id: 'vacation', icon: '🏖️', name: '휴가', color: '#f0f9ff', textColor: '#0284c7', borderColor: '#bae6fd', isCustom: false },
      { id: 'business', icon: '💼', name: '출장', color: '#0f172a', textColor: '#ffffff', borderColor: '#1e293b', isCustom: false },
      { id: 'outing', icon: '🚗', name: '나들이', color: '#f1f5f9', textColor: '#1e293b', borderColor: '#cbd5e1', isCustom: false },
      { id: 'camping', icon: '🏕️', name: '캠핑', color: '#e2e8f0', textColor: '#334155', borderColor: '#94a3b8', isCustom: false },
      { id: 'anniversary', icon: '🎉', name: '기념일', color: '#bae6fd', textColor: '#0369a1', borderColor: '#38bdf8', isCustom: false }
    ];

    // 커스텀 테마 색상 팔레트 옵션 (흑백 & 하늘색 톤)
    const COLOR_PALETTES = [
      { name: '스카이블루', color: '#e0f2fe', textColor: '#0369a1', borderColor: '#7dd3fc' },
      { name: '딥 스카이', color: '#bae6fd', textColor: '#0284c7', borderColor: '#38bdf8' },
      { name: '소프트 스노우', color: '#f0f9ff', textColor: '#0c4a6e', borderColor: '#bae6fd' },
      { name: '블랙 차콜', color: '#0f172a', textColor: '#ffffff', borderColor: '#1e293b' },
      { name: '다크 슬레이트', color: '#1e293b', textColor: '#f8fafc', borderColor: '#334155' },
      { name: '미디엄 그레이', color: '#e2e8f0', textColor: '#1e293b', borderColor: '#cbd5e1' },
      { name: '라이트 그레이', color: '#f1f5f9', textColor: '#334155', borderColor: '#e2e8f0' },
      { name: '화이트 실버', color: '#ffffff', textColor: '#0f172a', borderColor: '#cbd5e1' }
    ];

    function getCustomThemes() {
      try {
        const raw = localStorage.getItem(CUSTOM_THEMES_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function setCustomThemes(themes) {
      localStorage.setItem(CUSTOM_THEMES_STORAGE_KEY, JSON.stringify(themes));
      syncToCloud();
    }

    function getAllTripThemes() {
      return [...DEFAULT_TRIP_THEMES, ...getCustomThemes()];
    }

    let selectedTripTheme = DEFAULT_TRIP_THEMES[0];
    let selectedPalette = COLOR_PALETTES[0];

    // 데이터 로드 & 저장 헬퍼 (일기 & 날짜별 To-Do)
    function getStore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        console.error('데이터 파싱 오류:', e);
        return {};
      }
    }

    function setStore(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getDayData(dateStr) {
      const store = getStore();
      return store[dateStr] || { todos: [], diary: null };
    }

    function saveDayData(dateStr, dayData) {
      const store = getStore();
      store[dateStr] = dayData;
      setStore(store);
      syncToCloud();
    }

    // 여행/기간 일정 스토리지 헬퍼
    function getEventsStore() {
      try {
        const raw = localStorage.getItem(EVENTS_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        console.error('이벤트 파싱 오류:', e);
        return [];
      }
    }

    function setEventsStore(events) {
      localStorage.setItem(EVENTS_STORAGE_KEY, JSON.stringify(events));
      syncToCloud();
    }

    function getTripsForDate(dateStr) {
      const events = getEventsStore();
      return events.filter(e => e.startDate <= dateStr && dateStr <= e.endDate);
    }

    // 포맷팅 헬퍼
    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatKoreanDate(dateStr) {
      const [y, m, d] = dateStr.split('-');
      const date = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return `${y}년 ${parseInt(m)}월 ${parseInt(d)}일 (${days[date.getDay()]})`;
    }

    function formatCurrentTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    // 토스트 알림
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // 달력 렌더링
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth(); // 0 ~ 11

      // 월 텍스트 업데이트
      document.getElementById('month-display').textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById('days-grid');
      grid.innerHTML = '';

      // 첫째 날과 마지막 날 계산
      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);

      const startDayIndex = firstDayOfMonth.getDay(); // 0(일) ~ 6(토)
      const totalDays = lastDayOfMonth.getDate();

      // 이전 달 날짜들
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = startDayIndex - 1; i >= 0; i--) {
        const d = prevMonthLastDay - i;
        const prevDate = new Date(year, month - 1, d);
        const cell = createDayCell(prevDate, true);
        grid.appendChild(cell);
      }

      // 이번 달 날짜들
      const todayStr = formatDateKey(new Date());
      for (let day = 1; day <= totalDays; day++) {
        const thisDate = new Date(year, month, day);
        const cell = createDayCell(thisDate, false, todayStr);
        grid.appendChild(cell);
      }

      // 다음 달 날짜들 (7의 배수로 그리드 채우기)
      const remainingCells = (7 - ((startDayIndex + totalDays) % 7)) % 7;
      for (let i = 1; i <= remainingCells; i++) {
        const nextDate = new Date(year, month + 1, i);
        const cell = createDayCell(nextDate, true);
        grid.appendChild(cell);
      }
    }

    function createDayCell(date, isOtherMonth, todayStr) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (isOtherMonth) cell.classList.add('other-month');

      const dateStr = formatDateKey(date);
      if (dateStr === todayStr) cell.classList.add('today');

      const dayOfWeek = date.getDay();
      if (dayOfWeek === 0) cell.classList.add('sunday');
      if (dayOfWeek === 6) cell.classList.add('saturday');

      // 상단 날짜 헤더
      const header = document.createElement('div');
      header.className = 'day-header';

      const numSpan = document.createElement('span');
      numSpan.className = 'day-number';
      numSpan.textContent = date.getDate();
      header.appendChild(numSpan);
      cell.appendChild(header);

      // 1. 기간 일정 (여행 등) 배너 렌더링
      const trips = getTripsForDate(dateStr);
      if (trips.length > 0) {
        trips.forEach(trip => {
          const banner = document.createElement('div');
          banner.className = 'trip-event-banner';
          banner.style.background = trip.color || '#e0f2fe';
          banner.style.color = trip.textColor || '#0369a1';
          banner.style.border = `1px solid ${trip.borderColor || '#bae6fd'}`;

          banner.innerHTML = `<span>${trip.icon || '✈️'}</span> <span style="overflow:hidden; text-overflow:ellipsis;">${trip.title}</span>`;
          banner.title = `${trip.title} (${trip.startDate} ~ ${trip.endDate})`;
          banner.addEventListener('click', (e) => {
            e.stopPropagation();
            openModal(dateStr);
          });
          cell.appendChild(banner);
        });
      }

      // 하단 인디케이터 컨테이너
      const indicators = document.createElement('div');
      indicators.className = 'cell-indicators';

      const dayData = getDayData(dateStr);

      // 2. 일기 인디케이터 (과거 및 오늘 날짜에만 표시)
      const isFutureDate = dateStr > todayStr;
      if (!isFutureDate && dayData.diary && (dayData.diary.content || dayData.diary.mood)) {
        if (dayData.diary.mood) {
          const moodSpan = document.createElement('span');
          moodSpan.className = 'mood-indicator';
          moodSpan.textContent = dayData.diary.mood;
          indicators.appendChild(moodSpan);
        } else {
          const diaryBadge = document.createElement('span');
          diaryBadge.className = 'diary-indicator';
          diaryBadge.innerHTML = '📝 일기';
          indicators.appendChild(diaryBadge);
        }
      }

      // 3. To-Do 및 시간별 일정 인디케이터
      if (dayData.todos && dayData.todos.length > 0) {
        const pendingTodos = dayData.todos.filter(t => !t.completed);
        const timedTodos = pendingTodos.filter(t => !!t.time);

        // 시간이 있는 일정이 있다면 대표로 첫 번째 시간 일정 표시 (하늘색 포인트)
        if (timedTodos.length > 0) {
          const firstTimed = timedTodos[0];
          const timeBadge = document.createElement('span');
          timeBadge.className = 'todo-indicator';
          timeBadge.style.background = 'var(--primary-soft)';
          timeBadge.style.color = '#0284c7';
          timeBadge.style.borderColor = 'var(--primary-border)';
          timeBadge.innerHTML = `🕒 ${firstTimed.time} ${firstTimed.text}`;
          indicators.appendChild(timeBadge);
        }

        const todoBadge = document.createElement('span');
        todoBadge.className = 'todo-indicator';
        if (pendingTodos.length > 0) {
          todoBadge.textContent = `☑️ ${pendingTodos.length}건 남음`;
        } else {
          todoBadge.textContent = `✓ 완료 (${dayData.todos.length})`;
          todoBadge.style.background = '#f8fafc';
          todoBadge.style.color = '#94a3b8';
          todoBadge.style.borderColor = '#e2e8f0';
        }
        indicators.appendChild(todoBadge);
      }

      cell.appendChild(indicators);

      cell.addEventListener('click', () => {
        openModal(dateStr);
      });

      return cell;
    }

    // 날짜 상세 모달 열기
    function openModal(dateStr) {
      selectedDateStr = dateStr;
      const todayStr = formatDateKey(new Date());
      const isFuture = dateStr > todayStr;
      const isToday = dateStr === todayStr;

      // 헤더 타이틀 및 뱃지 (흑백 & 하늘색 포인트)
      let badgeHtml = '';
      if (isToday) {
        badgeHtml = ' <span style="font-size:12px; background:var(--primary-soft); color:#0284c7; border:1px solid var(--primary-border); padding:3px 9px; border-radius:12px; font-weight:600;">오늘</span>';
      } else if (isFuture) {
        badgeHtml = ' <span style="font-size:12px; background:#f1f5f9; color:#334155; border:1px solid #e2e8f0; padding:3px 9px; border-radius:12px; font-weight:600;">미래 일정</span>';
      }
      document.getElementById('modal-date-title').innerHTML = `📅 <span>${formatKoreanDate(dateStr)}</span>${badgeHtml}`;

      // 이 날짜의 여행/기간 일정 렌더링
      renderDayTrips(dateStr);

      const dayData = getDayData(dateStr);

      // 1. 할 일 목록 렌더링
      renderTodoList(dayData.todos || []);
      document.getElementById('todo-input').value = '';
      document.getElementById('todo-time').value = '';

      // 2. 일기 및 미래 날짜 제어
      const diarySection = document.getElementById('diary-section');
      const futureNotice = document.getElementById('future-notice');
      const diarySaveBtn = document.getElementById('diary-save-btn');
      const deleteBtn = document.getElementById('diary-delete-btn');

      if (isFuture) {
        // 미래 날짜: 일기 및 기분 작성 비활성화/숨김
        futureNotice.style.display = 'block';
        diarySection.style.display = 'none';
        diarySaveBtn.style.display = 'none';
        deleteBtn.style.display = 'none';
      } else {
        // 오늘 또는 과거 날짜: 일기 및 기분 작성 활성화
        futureNotice.style.display = 'none';
        diarySection.style.display = 'block';
        diarySaveBtn.style.display = 'inline-flex';
        deleteBtn.style.display = 'inline-flex';

        const diary = dayData.diary;
        if (diary) {
          document.getElementById('diary-textarea').value = diary.content || '';
          document.getElementById('meta-time').value = diary.time || '';
          document.getElementById('meta-weather').value = diary.weather || '';
          document.getElementById('meta-location').value = diary.location || '';
          setMoodSelection(diary.mood || '');
          deleteBtn.style.visibility = 'visible';
        } else {
          document.getElementById('diary-textarea').value = '';
          setMoodSelection('');
          deleteBtn.style.visibility = 'hidden';

          // 오늘 날짜를 클릭했고 일기가 없다면 실시간 정보 자동 세팅
          if (isToday) {
            document.getElementById('meta-time').value = formatCurrentTime();
            fetchWeatherAndLocation(false);
          } else {
            document.getElementById('meta-time').value = '';
            document.getElementById('meta-weather').value = '';
            document.getElementById('meta-location').value = '';
          }
        }
      }

      // 모달 활성화
      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      renderCalendar();
    }

    // 해당 날짜의 여행/기간 일정 목록 표시
    function renderDayTrips(dateStr) {
      const container = document.getElementById('day-trips-container');
      const listEl = document.getElementById('day-trips-list');
      const trips = getTripsForDate(dateStr);

      listEl.innerHTML = '';
      if (!trips || trips.length === 0) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'block';
      trips.forEach(trip => {
        const item = document.createElement('div');
        item.className = 'trip-badge-item';
        item.style.background = trip.color || '#e0f2fe';
        item.style.color = trip.textColor || '#0369a1';
        item.style.border = `1px solid ${trip.borderColor || '#bae6fd'}`;

        const info = document.createElement('div');
        info.innerHTML = `<span>${trip.icon || '✈️'}</span> <strong>${trip.title}</strong> <span style="font-size:12px; opacity:0.85; margin-left:6px;">(${trip.startDate} ~ ${trip.endDate})</span>`;

        const delBtn = document.createElement('button');
        delBtn.className = 'trip-del-btn';
        delBtn.textContent = '일정 삭제';
        delBtn.addEventListener('click', () => {
          if (confirm(`'${trip.title}' 여행 일정을 삭제하시겠습니까?`)) {
            deleteTrip(trip.id);
            renderDayTrips(dateStr);
            renderCalendar();
          }
        });

        item.appendChild(info);
        item.appendChild(delBtn);
        listEl.appendChild(item);
      });
    }

    // 기분 선택 UI
    function setMoodSelection(mood) {
      selectedMood = mood;
      document.querySelectorAll('.mood-btn').forEach(btn => {
        if (btn.dataset.mood === mood) {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }
      });
    }

    document.querySelectorAll('.mood-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const mood = btn.dataset.mood;
        if (selectedMood === mood) {
          setMoodSelection(''); // 토글 해제
        } else {
          setMoodSelection(mood);
        }
      });
    });

    // 할 일 리스트 렌더링 (시간 있는 일정 우선 정렬)
    function renderTodoList(todos) {
      const listEl = document.getElementById('todo-list');
      listEl.innerHTML = '';

      if (!todos || todos.length === 0) {
        listEl.innerHTML = '<div class="todo-empty-msg">등록된 할 일이나 일정이 없습니다.</div>';
        return;
      }

      // 시간 순서 정렬: 시간이 있는 일정 오름차순 -> 시간 없는 일정
      todos.sort((a, b) => {
        if (a.time && b.time) return a.time.localeCompare(b.time);
        if (a.time && !b.time) return -1;
        if (!a.time && b.time) return 1;
        return 0;
      });

      todos.forEach((todo, idx) => {
        const item = document.createElement('div');
        item.className = 'todo-item' + (todo.completed ? ' completed' : '');

        const left = document.createElement('div');
        left.className = 'todo-left';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'todo-checkbox';
        checkbox.checked = !!todo.completed;
        checkbox.addEventListener('change', () => {
          todos[idx].completed = checkbox.checked;
          saveTodos(todos);
        });

        left.appendChild(checkbox);

        // 시간 태그가 있으면 표시
        if (todo.time) {
          const timeTag = document.createElement('span');
          timeTag.className = 'todo-time-tag';
          timeTag.innerHTML = `🕒 ${todo.time}`;
          left.appendChild(timeTag);
        }

        const text = document.createElement('span');
        text.className = 'todo-text';
        text.textContent = todo.text;
        left.appendChild(text);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'todo-delete-btn';
        deleteBtn.textContent = '✕';
        deleteBtn.title = '삭제';
        deleteBtn.addEventListener('click', () => {
          todos.splice(idx, 1);
          saveTodos(todos);
        });

        item.appendChild(left);
        item.appendChild(deleteBtn);
        listEl.appendChild(item);
      });
    }

    function addTodo() {
      const input = document.getElementById('todo-input');
      const timeInput = document.getElementById('todo-time');
      const text = input.value.trim();
      const time = timeInput.value.trim();

      if (!text) return;

      const dayData = getDayData(selectedDateStr);
      const todos = dayData.todos || [];
      todos.push({
        id: Date.now(),
        text: text,
        time: time, // 시간 지정 (예: '14:00' 또는 '')
        completed: false
      });

      saveTodos(todos);
      input.value = '';
      timeInput.value = '';
      input.focus();
    }

    function saveTodos(todos) {
      const dayData = getDayData(selectedDateStr);
      dayData.todos = todos;
      saveDayData(selectedDateStr, dayData);
      renderTodoList(todos);
      renderCalendar();
    }

    // 일기 저장
    function saveDiary() {
      const todayStr = formatDateKey(new Date());
      if (selectedDateStr > todayStr) {
        showToast('미래 날짜에는 일기를 작성할 수 없습니다.');
        return;
      }

      const content = document.getElementById('diary-textarea').value.trim();
      const time = document.getElementById('meta-time').value.trim();
      const weather = document.getElementById('meta-weather').value.trim();
      const location = document.getElementById('meta-location').value.trim();

      if (!content && !selectedMood && !time && !weather && !location) {
        showToast('내용이나 기분을 입력해주세요.');
        return;
      }

      const dayData = getDayData(selectedDateStr);
      dayData.diary = {
        content: content,
        mood: selectedMood,
        time: time || formatCurrentTime(),
        weather: weather,
        location: location,
        updatedAt: new Date().toISOString()
      };

      saveDayData(selectedDateStr, dayData);
      showToast('일기가 저장되었습니다! ✨');
      closeModal();
    }

    // 일기 삭제
    function deleteDiary() {
      if (!confirm('작성한 일기를 삭제하시겠습니까? (할 일 및 일정은 유지됩니다)')) return;

      const dayData = getDayData(selectedDateStr);
      dayData.diary = null;
      saveDayData(selectedDateStr, dayData);
      showToast('일기가 삭제되었습니다.');
      closeModal();
    }

    // 실시간 날씨 및 위치 정보 자동 가져오기
    function fetchWeatherAndLocation(showAlert = true) {
      const timeInput = document.getElementById('meta-time');
      const weatherInput = document.getElementById('meta-weather');
      const locationInput = document.getElementById('meta-location');

      timeInput.value = formatCurrentTime();

      if (!navigator.geolocation) {
        if (showAlert) showToast('이 브라우저는 위치 정보를 지원하지 않습니다.');
        return;
      }

      weatherInput.placeholder = '날씨 수신 중...';
      locationInput.placeholder = '위치 확인 중...';

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          try {
            const weatherRes = await fetch(
              `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`
            );
            if (weatherRes.ok) {
              const weatherData = await weatherRes.json();
              const temp = Math.round(weatherData.current.temperature_2m);
              const code = weatherData.current.weather_code;
              const desc = getWeatherDesc(code);
              weatherInput.value = `${desc} ${temp}°C`;
            }
          } catch (e) {
            console.warn('날씨 조회 실패:', e);
            weatherInput.value = '☀️ 맑음';
          }

          try {
            const geoRes = await fetch(
              `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`
            );
            if (geoRes.ok) {
              const geoData = await geoRes.json();
              const parts = [];
              if (geoData.principalSubdivision) parts.push(geoData.principalSubdivision);
              if (geoData.city && geoData.city !== geoData.principalSubdivision) parts.push(geoData.city);
              if (geoData.locality && !parts.includes(geoData.locality)) parts.push(geoData.locality);

              const locStr = parts.slice(0, 2).join(' ') || geoData.locality || '내 위치';
              locationInput.value = locStr;
            }
          } catch (e) {
            console.warn('위치 지명 조회 실패:', e);
            locationInput.value = '내 위치';
          }

          if (showAlert) showToast('실시간 정보(시간·날씨·위치)를 불러왔습니다!');
        },
        (err) => {
          console.warn('위치 권한 거부 또는 오류:', err);
          weatherInput.placeholder = '날씨 직접 입력';
          locationInput.placeholder = '장소 직접 입력';
          if (showAlert) {
            showToast('위치 권한이 차단되어 직접 입력하실 수 있습니다.');
          }
        },
        { timeout: 7000 }
      );
    }

    // 날씨 코드 변환기
    function getWeatherDesc(code) {
      if (code === 0) return '☀️ 맑음';
      if ([1, 2].includes(code)) return '🌤️ 대체로 맑음';
      if (code === 3) return '☁️ 흐림';
      if ([45, 48].includes(code)) return '🌫️ 안개';
      if ([51, 53, 55].includes(code)) return '🌦️ 이슬비';
      if ([61, 63, 65].includes(code)) return '🌧️ 비';
      if ([71, 73, 75].includes(code)) return '❄️ 눈';
      if ([80, 81, 82].includes(code)) return '🌧️ 소나기';
      if ([95, 96, 99].includes(code)) return '⛈️ 뇌우';
      return '☀️ 맑음';
    }

    // ================= 여행 / 기간 일정 모달 로직 =================
    function initTripThemeSelector() {
      const container = document.getElementById('trip-theme-selector');
      container.innerHTML = '';
      const allThemes = getAllTripThemes();

      allThemes.forEach((theme) => {
        const btn = document.createElement('div');
        btn.className = 'theme-chip-btn';
        btn.innerHTML = `<span>${theme.icon}</span> <span>${theme.name}</span>`;

        if (theme.id === selectedTripTheme.id) {
          btn.style.background = theme.color;
          btn.style.borderColor = theme.borderColor;
          btn.style.color = theme.textColor;
          btn.style.fontWeight = '700';
          btn.style.boxShadow = `0 0 0 1px ${theme.borderColor}`;
        }

        // 사용자가 추가한 커스텀 테마인 경우 삭제 버튼(x) 제공
        if (theme.isCustom) {
          const delSpan = document.createElement('span');
          delSpan.className = 'theme-del-btn';
          delSpan.innerHTML = '&times;';
          delSpan.title = '이 커스텀 테마 삭제';
          delSpan.addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm(`'${theme.name}' 커스텀 테마를 삭제하시겠습니까?`)) {
              deleteCustomTheme(theme.id);
            }
          });
          btn.appendChild(delSpan);
        }

        btn.addEventListener('click', () => {
          selectedTripTheme = theme;
          initTripThemeSelector();
        });
        container.appendChild(btn);
      });
    }

    // 커스텀 테마 색상 팔레트 렌더링
    function initPaletteSelector() {
      const paletteContainer = document.getElementById('theme-color-palette');
      paletteContainer.innerHTML = '';

      COLOR_PALETTES.forEach((p, idx) => {
        const chip = document.createElement('div');
        chip.className = 'color-chip' + (p === selectedPalette ? ' selected' : '');
        chip.style.backgroundColor = p.color;
        chip.style.borderColor = p.borderColor;
        chip.title = p.name;

        chip.addEventListener('click', () => {
          selectedPalette = p;
          initPaletteSelector();
        });

        paletteContainer.appendChild(chip);
      });
    }

    // 새 테마 추가 폼 토글
    function toggleNewThemeForm(show) {
      const card = document.getElementById('new-theme-card');
      const isVisible = card.style.display === 'block';
      const willShow = show !== undefined ? show : !isVisible;

      card.style.display = willShow ? 'block' : 'none';
      if (willShow) {
        initPaletteSelector();
        document.getElementById('custom-theme-name').focus();
      }
    }

    // 새로운 커스텀 테마 저장
    function saveCustomTheme() {
      const iconInput = document.getElementById('custom-theme-icon');
      const nameInput = document.getElementById('custom-theme-name');
      const icon = iconInput.value.trim() || '🎯';
      const name = nameInput.value.trim();

      if (!name) {
        alert('테마 이름을 입력해주세요. (예: 콘서트, 등산, 스터디 등)');
        nameInput.focus();
        return;
      }

      const customThemes = getCustomThemes();
      const newTheme = {
        id: 'custom_' + Date.now(),
        icon: icon,
        name: name,
        color: selectedPalette.color,
        textColor: selectedPalette.textColor,
        borderColor: selectedPalette.borderColor,
        isCustom: true
      };

      customThemes.push(newTheme);
      setCustomThemes(customThemes);

      // 새로 생성된 테마를 즉시 선택
      selectedTripTheme = newTheme;

      // 폼 초기화 및 닫기
      nameInput.value = '';
      toggleNewThemeForm(false);
      initTripThemeSelector();

      showToast(`'${name}' 새 테마가 추가되었습니다! 🎨`);
    }

    // 커스텀 테마 삭제
    function deleteCustomTheme(themeId) {
      let customThemes = getCustomThemes();
      customThemes = customThemes.filter(t => t.id !== themeId);
      setCustomThemes(customThemes);

      if (selectedTripTheme.id === themeId) {
        selectedTripTheme = DEFAULT_TRIP_THEMES[0];
      }
      initTripThemeSelector();
      showToast('커스텀 테마가 삭제되었습니다.');
    }

    function openTripModal(defaultStart = null, defaultEnd = null) {
      const today = formatDateKey(new Date());
      document.getElementById('trip-title').value = '';
      document.getElementById('trip-start-date').value = defaultStart || today;
      document.getElementById('trip-end-date').value = defaultEnd || defaultStart || today;
      selectedTripTheme = getAllTripThemes()[0];
      selectedPalette = COLOR_PALETTES[0];

      toggleNewThemeForm(false);
      initTripThemeSelector();

      document.getElementById('trip-modal-overlay').classList.add('active');
      document.getElementById('trip-title').focus();
    }

    function closeTripModal() {
      document.getElementById('trip-modal-overlay').classList.remove('active');
      toggleNewThemeForm(false);
    }

    function saveTrip() {
      const title = document.getElementById('trip-title').value.trim();
      const startDate = document.getElementById('trip-start-date').value;
      const endDate = document.getElementById('trip-end-date').value;

      if (!title) {
        alert('일정 이름이나 여행지를 입력해주세요.');
        return;
      }
      if (!startDate || !endDate) {
        alert('시작 날짜와 종료 날짜를 모두 선택해주세요.');
        return;
      }
      if (startDate > endDate) {
        alert('시작 날짜는 종료 날짜보다 앞서야 합니다.');
        return;
      }

      const events = getEventsStore();
      const newTrip = {
        id: Date.now(),
        title: title,
        startDate: startDate,
        endDate: endDate,
        icon: selectedTripTheme.icon,
        color: selectedTripTheme.color,
        textColor: selectedTripTheme.textColor,
        borderColor: selectedTripTheme.borderColor,
        createdAt: new Date().toISOString()
      };

      events.push(newTrip);
      setEventsStore(events);

      showToast(`'${title}' 일정이 등록되었습니다! ✈️`);
      closeTripModal();

      // 만약 날짜 모달이 열려 있다면 해당 날짜의 여행 목록도 갱신
      if (selectedDateStr) {
        renderDayTrips(selectedDateStr);
      }
      renderCalendar();
    }

    function deleteTrip(tripId) {
      const events = getEventsStore().filter(e => e.id !== tripId);
      setEventsStore(events);
      showToast('여행 일정이 삭제되었습니다.');
    }

    // 백업 & 복원 기능 (날짜별 데이터 + 여행/기간 일정 + 커스텀 테마 모두 백업)
    function backupData() {
      const payload = {
        version: 3,
        calendarData: getStore(),
        trips: getEventsStore(),
        customThemes: getCustomThemes(),
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `daily-log-backup-${formatDateKey(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('모든 일정 및 커스텀 테마 데이터가 백업되었습니다.');
    }

    function restoreData(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.calendarData) {
            setStore(data.calendarData);
            setEventsStore(data.trips || []);
            if (data.customThemes) {
              setCustomThemes(data.customThemes);
            }
          } else {
            // 구버전 백업 파일 호환
            setStore(data);
          }
          renderCalendar();
          showToast('데이터가 성공적으로 복원되었습니다!');
        } catch (err) {
          alert('올바른 백업 JSON 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    }

    // ================= 이벤트 리스너 등록 =================
    document.getElementById('prev-month-btn').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('next-month-btn').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    document.getElementById('today-btn').addEventListener('click', () => {
      currentDate = new Date();
      renderCalendar();
      showToast('오늘 날짜로 이동했습니다.');
    });

    // 날짜 모달 이벤트
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
    document.getElementById('diary-save-btn').addEventListener('click', saveDiary);
    document.getElementById('diary-delete-btn').addEventListener('click', deleteDiary);

    document.getElementById('todo-add-btn').addEventListener('click', addTodo);
    document.getElementById('todo-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    document.getElementById('modal-add-trip-btn').addEventListener('click', () => {
      openTripModal(selectedDateStr, selectedDateStr);
    });

    document.getElementById('auto-fetch-btn').addEventListener('click', () => {
      fetchWeatherAndLocation(true);
    });

    // 여행 모달 및 커스텀 테마 이벤트
    document.getElementById('open-trip-modal-btn').addEventListener('click', () => {
      openTripModal();
    });
    document.getElementById('trip-modal-close-btn').addEventListener('click', closeTripModal);
    document.getElementById('trip-modal-cancel-btn').addEventListener('click', closeTripModal);
    document.getElementById('trip-save-btn').addEventListener('click', saveTrip);
    document.getElementById('trip-title').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') saveTrip();
    });

    // 커스텀 테마 추가 토글 & 저장
    document.getElementById('toggle-new-theme-btn').addEventListener('click', () => {
      toggleNewThemeForm();
    });
    document.getElementById('cancel-custom-theme-btn').addEventListener('click', () => {
      toggleNewThemeForm(false);
    });
    document.getElementById('save-custom-theme-btn').addEventListener('click', saveCustomTheme);
    document.getElementById('custom-theme-name').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') saveCustomTheme();
    });

    // 백업/복원 이벤트
    document.getElementById('backup-btn').addEventListener('click', backupData);
    document.getElementById('restore-btn').addEventListener('click', () => {
      document.getElementById('restore-file-input').click();
    });
    document.getElementById('restore-file-input').addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        restoreData(e.target.files[0]);
      }
    });

    // 모달 배경 클릭 시 닫기
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal-overlay')) {
        closeModal();
      }
    });
    document.getElementById('trip-modal-overlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('trip-modal-overlay')) {
        closeTripModal();
      }
    });

    // ESC 키로 모달 닫기
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
        closeTripModal();
      }
    });

    // 구글 로그인 이벤트
    document.getElementById('google-auth-btn').addEventListener('click', handleGoogleAuth);

    // Firebase 인증 상태 변화 감지
    if (auth) {
      auth.onAuthStateChanged(user => {
        const authBtn = document.getElementById('google-auth-btn');
        if (user) {
          currentUser = user;
          const name = user.displayName || user.email.split('@')[0];
          authBtn.innerHTML = `👤 ${name} (로그아웃)`;
          authBtn.style.color = '#0f172a';
          authBtn.style.background = '#f8fafc';
          authBtn.style.borderColor = '#cbd5e1';
          listenToCloud(user.uid);
        } else {
          currentUser = null;
          authBtn.innerHTML = `🔑 구글 로그인 (실시간 연동)`;
          authBtn.style.color = '#0284c7';
          authBtn.style.background = '#f0f9ff';
          authBtn.style.borderColor = '#bae6fd';
          updateSyncBadge('☁️ 로컬 저장 모드', '#64748b', '#f1f5f9');
        }
      });
    }

    // 초기 렌더링
    renderCalendar();
  </script>
</body>
</html>
